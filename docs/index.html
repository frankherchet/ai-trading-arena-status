const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {

  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(PAYLOAD.salt),

function resolve(from, href) {
  const parts = from.split("/").slice(0, -1);

  let path = parts.join("/");
  if (href.endsWith("/")) path = (path ? path + "/" : "") + "README.md";
  return path;
}
function show() {
  const path = decodeURIComponent(location.hash.slice(1)) || "README.md";

  if (md === undefined) { page.textContent = "Page not found: " + path; return; }
  page.innerHTML = DOMPurify.sanitize(marked.parse(md), {ADD_TAGS: ["details", "summary"]});
  for (const img of page.querySelectorAll("img")) {

async function openSite(pass) {

  const nav = document.getElementById("nav");
  nav.hidden = false;
  const links = [["README.md", "Overview"]].concat(Object.keys(data.pages)
    .filter(p => p.startsWith("agents/")).map(p => [p, p.slice(7, -3)]), [["reports/README.md", "Weekly reviews"]]);
